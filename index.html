<!doctype html>
<html lang="ja" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ビットとデータの表現学習</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; box-sizing: border-box; }
    .font-display { font-family: 'Quicksand', sans-serif; }
    .bulb-on { filter: drop-shadow(0 0 15px #fbbf24) drop-shadow(0 0 30px #f59e0b); }
    @keyframes pulse-grow {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .pulse-in { animation: pulse-grow 0.3s ease-out; }
    .glow-text { text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
  </style>
</head>
<body class="h-full text-slate-200" style="background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);">
  <div id="app" class="h-full w-full overflow-auto">
    <header class="text-center pt-6 pb-4 px-4">
      <h1 class="font-display text-2xl md:text-4xl font-bold text-amber-400 mb-2">💡 ビットと情報の変化</h1>
      <p class="text-slate-400 text-sm md:text-base">スイッチの組み合わせで、表せる「情報」が変わるよ！</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-8">
      <div class="bg-slate-800/60 rounded-2xl p-5 mb-6 border border-slate-700">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <div class="text-slate-300 font-bold mb-1 text-lg">電球（ビット）の数</div>
            <div id="bit-theme-label" class="text-amber-400 font-bold">現在のテーマ：読み込み中...</div>
          </div>
          <div class="flex items-center gap-3">
            <button id="decrease-bulbs" class="w-12 h-12 rounded-full bg-slate-700 hover:bg-slate-600 text-white text-2xl font-bold transition-all border border-slate-600"> − </button>
            <span id="bulb-count" class="font-display text-4xl text-amber-400 font-bold w-12 text-center">2</span>
            <button id="increase-bulbs" class="w-12 h-12 rounded-full bg-amber-500 hover:bg-amber-400 text-white text-2xl font-bold transition-all"> + </button>
          </div>
        </div>
      </div>

      <div id="emoji-container" class="bg-indigo-950/40 rounded-3xl p-8 mb-6 border-2 border-indigo-500/30 text-center transition-all">
        <div class="text-indigo-300 text-xs mb-4 tracking-widest uppercase font-bold">Computer Data Interpretation</div>
        <div id="emoji-result" class="text-8xl md:text-9xl transition-all font-display font-bold glow-text py-4 flex justify-center items-center min-h-[160px]"></div>
        <div id="emoji-label" class="text-amber-400 font-bold mt-4 text-2xl tracking-widest"></div>
      </div>

      <div class="bg-slate-900/50 rounded-2xl p-6 mb-6 border border-slate-700">
        <div id="bulbs-container" class="flex justify-center items-end gap-3 flex-wrap min-h-24"></div>
      </div>

      <div class="bg-slate-800/60 rounded-2xl p-5 mb-6 border border-slate-700 text-center">
        <div id="switches-container" class="flex justify-center items-center gap-2 flex-wrap mb-4"></div>
        <div class="pt-4 border-t border-slate-700 inline-block w-full">
          <span class="text-slate-500 text-sm font-bold">2進数データ: </span>
          <span id="binary-display" class="font-display text-2xl text-cyan-400 mx-2 tracking-widest">00</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    let bulbCount = 2;
    let bits = [0, 0];

    // --- 各ビットのデータ定義 ---
    const dataMaps = {
      2: [
        { icon: '☀️', label: 'はれ' }, { icon: '☁️', label: 'くもり' },
        { icon: '☔', label: 'あめ' }, { icon: '☃️', label: 'ゆき' }
      ],
      3: [
        { icon: '🔴', label: '赤' }, { icon: '🟠', label: '橙' }, { icon: '🟡', label: '黄' }, { icon: '🟢', label: '緑' },
        { icon: '🔵', label: '青' }, { icon: '🪻', label: '藍' }, { icon: '🟣', label: '紫' }, { icon: '🌈', label: 'にじ' }
      ],
      4: [
        { icon: '🐶', label: 'イヌ' }, { icon: '🐱', label: 'ネコ' }, { icon: '🐭', label: 'ネズミ' }, { icon: '🐹', label: 'ハムスター' },
        { icon: '🍎', label: 'リンゴ' }, { icon: '🍌', label: 'バナナ' }, { icon: '🍇', label: 'ブドウ' }, { icon: '🍉', label: 'スイカ' },
        { icon: '⚽', label: 'サッカー' }, { icon: '🏀', label: 'バスケ' }, { icon: '⚾', label: '野球' }, { icon: '🎾', label: 'テニス' },
        { icon: '🚗', label: 'クルマ' }, { icon: '✈️', label: 'ヒコーキ' }, { icon: '🚀', label: 'ロケット' }, { icon: '🛸', label: 'UFO' }
      ],
      5: "ABCDEFGHIJKLMNOPQRSTUVWXYZ!?@#&=".split('').map(char => ({ icon: char, label: `${char}` })),
      6: [
        '🍎','🍊','🍋','🍌','🍉','🍇','🍓','🍈','🍒','🍑','🍍','🥦','🌽','🥕','🍔','🍟',
        '🍕','🍙','🍣','🍦','🍩','🍪','🍫','🧁','🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼',
        '🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐣','🐝','🦋','🐞','🐙','🦑','🦐','🐠','🐬',
        '🚗','🚕','🚌','🏎️','🚓','🚑','🚒','🚲','✈️','🚀','🛸','🛳️','🎸','🎮','⌚','📱'
      ].map(emoji => ({ icon: emoji, label: 'ずかん' }))
    };

    const themes = {
      1: "1ビット：ON か OFF か",
      2: "2ビット：おてんき",
      3: "3ビット：にじの色",
      4: "4ビット：いろいろな絵",
      5: "5ビット：アルファベット",
      6: "6ビット：たくさん図鑑",
      7: "7ビット：さらに倍！",
      8: "8ビット：1バイト(256通り)"
    };

    function createBulb(isOn, index) {
      const div = document.createElement('div');
      div.className = "flex flex-col items-center pulse-in";
      div.innerHTML = `
        <svg width="40" height="60" viewBox="0 0 50 70" class="${isOn ? 'bulb-on' : ''}">
          <circle cx="25" cy="35" r="20" fill="${isOn ? '#fef3c7' : '#374151'}" stroke="${isOn ? '#fcd34d' : '#4b5563'}" stroke-width="2"/>
          <path d="M20 55 L30 55 L28 65 L22 65 Z" fill="#888"/>
        </svg>
      `;
      return div;
    }

    function createSwitch(index, isOn) {
      const btn = document.createElement('button');
      btn.className = `w-14 h-20 rounded-xl border-b-4 flex flex-col items-center justify-center transition-all ${isOn ? 'bg-amber-500 border-amber-700 translate-y-1' : 'bg-slate-600 border-slate-800'}`;
      btn.innerHTML = `<span class="text-2xl font-display font-bold text-white">${isOn ? '1' : '0'}</span><span class="text-[8px] opacity-50">BIT ${index+1}</span>`;
      btn.onclick = () => { bits[index] = bits[index] ? 0 : 1; render(); };
      return btn;
    }

    function render() {
      // データの同期
      while (bits.length < bulbCount) bits.push(0);
      while (bits.length > bulbCount) bits.pop();

      // UIの更新
      document.getElementById('bulb-count').textContent = bulbCount;
      document.getElementById('bit-theme-label').textContent = `現在のテーマ：${themes[bulbCount] || bulbCount + 'ビット'}`;

      // 電球表示
      const bContainer = document.getElementById('bulbs-container');
      bContainer.innerHTML = '';
      bits.forEach((b, i) => bContainer.appendChild(createBulb(b === 1, i)));

      // スイッチ表示
      const sContainer = document.getElementById('switches-container');
      sContainer.innerHTML = '';
      bits.forEach((b, i) => sContainer.appendChild(createSwitch(i, b === 1)));

      // 2進数文字列と数値計算
      const binaryStr = bits.join('');
      document.getElementById('binary-display').textContent = binaryStr;
      const val = parseInt(binaryStr, 2);

      // 絵文字/文字表示
      const res = document.getElementById('emoji-result');
      const lab = document.getElementById('emoji-label');
      const container = document.getElementById('emoji-container');

      const currentMap = dataMaps[bulbCount];
      if (currentMap && currentMap[val]) {
        container.style.display = 'block';
        res.textContent = currentMap[val].icon;
        lab.textContent = currentMap[val].label;
        
        // 5ビットのアルファベットの時は色を青白くして「文字」っぽさを強調
        res.className = `text-8xl md:text-9xl transition-all font-display font-bold glow-text py-4 flex justify-center items-center min-h-[160px] pulse-in ${bulbCount === 5 ? 'text-cyan-300' : 'text-white'}`;
      } else {
        container.style.display = 'none';
      }

      // ボタン制御
      document.getElementById('decrease-bulbs').disabled = bulbCount <= 1;
      document.getElementById('increase-bulbs').disabled = bulbCount >= 8;
    }

    document.getElementById('decrease-bulbs').onclick = () => { if(bulbCount > 1) { bulbCount--; render(); } };
    document.getElementById('increase-bulbs').onclick = () => { if(bulbCount < 8) { bulbCount++; render(); } };

    render();
  </script>
</body>
</html>
